# Publishes a release when it's tagged, like v0.2.0: the compiler as the checks built
# and tested it on that commit, for each platform, never built again here (decision
# 0014), the libraries the desktop and terminal apps it writes are built on, and their
# SHA256SUMS on the GitHub release, which uione.io/install.sh downloads, the container
# image on ghcr.io/da0x/uione, and the image deploys are built in on
# ghcr.io/da0x/uione-builder.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      # The checks run on the commit once it's pushed to main, before it's tagged, so
      # theirs are usually done; they're waited for when they aren't.
      - name: Take the compiler the checks built and tested on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 180); do
            run=$(gh run list --workflow checks.yml --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId,status,conclusion --jq '.[0] // {}')
            [ "$(echo "$run" | jq -r .status)" = completed ] && break
            sleep 20
          done
          [ "$(echo "$run" | jq -r .conclusion)" = success ] || { echo "the checks on $GITHUB_SHA haven't passed: $run" >&2; exit 1; }
          gh run download "$(echo "$run" | jq -r .databaseId)" --name linux-x86_64 --name linux-aarch64 --name macos-arm64 --dir downloaded
          mkdir -p release
          find downloaded -name 'one-*.tar.gz' -exec mv {} release/ \;
          ls release

      - name: Check it's the version being released
        run: |
          tar -xzf release/one-linux-x86_64.tar.gz -C "$RUNNER_TEMP" one
          built=$("$RUNNER_TEMP/one" --version)
          [ "$built" = "one ${GITHUB_REF_NAME#v}" ] || { echo "the build says '$built', but the release is ${GITHUB_REF_NAME#v}" >&2; exit 1; }

      - name: Pack the libraries the desktop and terminal apps are built on
        run: tools/release/libraries release
      - name: List the builds' checksums
        working-directory: release
        run: sha256sum one-*.tar.gz uione-libraries.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(ls site/releases/01-*.md)
          gh release create "$GITHUB_REF_NAME" release/* --title "${GITHUB_REF_NAME#v}" --notes-file "$notes" --verify-tag
      - name: Publish the container image
        run: |
          mkdir image
          for machine in x86_64:amd64 aarch64:arm64; do
            tar -xzf "release/one-linux-${machine%%:*}.tar.gz" -C image one
            mv image/one "image/one-linux-${machine##*:}"
          done
          cp LICENSE image/
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx create --use
          docker buildx build image --file tools/release/dockerfile --platform linux/amd64,linux/arm64 --push \
            --tag "ghcr.io/da0x/uione:${GITHUB_REF_NAME#v}" --tag ghcr.io/da0x/uione:latest
      # Cloud Build runs on amd64, so the builder is built for it alone.
      - name: Publish the builder image
        run: |
          docker buildx build image --file tools/release/builder/dockerfile --platform linux/amd64 --push \
            --tag "ghcr.io/da0x/uione-builder:${GITHUB_REF_NAME#v}" --tag ghcr.io/da0x/uione-builder:latest
